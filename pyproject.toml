[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-replay-divergence"
version = "0.1.0"
description = "Measures which part of a stateful streaming job's output survives a replay, and which part the log structurally cannot reproduce."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "coverage>=7",
  "playwright>=1.40",
  "cmarkgfm>=2024.1.14",
  "ruff>=0.4",
]

[project.scripts]
srd = "srd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/srd"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["srd", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# argparse hands every handler the same namespace, so a handler that does
# not read it still has to accept it.
"src/*/cli.py" = ["ARG001"]
"tools/*" = ["PTH", "E402"]
"experiments/*" = ["E402"]
