[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-replay-divergence"
version = "0.1.0"
description = "Measures which part of a stateful streaming job's output survives a replay, and which part the log structurally cannot reproduce."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
srd = "srd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/srd"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
