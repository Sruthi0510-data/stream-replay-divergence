<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="title desc">
<title id="title">Where the rows went</title>
<desc id="desc">A bar chart splitting the union of the two output tables into rows that are identical, rows changed by dropped records, rows only the replay produced, and rows that differ only in a last-value column.</desc>
<rect width="860" height="300" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1d1d1b" text-anchor="start">Where the rows went</text>
<text x="24.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="start">820 rows across both tables. Only the first bar needed no explanation.</text>
<text x="24.0" y="103.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1d1d1b" text-anchor="start">identical in both runs</text>
<rect x="250" y="88" width="600.0" height="22" rx="3" fill="#1baf7a"/>
<text x="860.0" y="104.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1b" text-anchor="start">508</text>
<text x="24.0" y="147.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1d1d1b" text-anchor="start">changed by dropped records</text>
<rect x="250" y="132" width="318.9" height="22" rx="3" fill="#eb6834"/>
<text x="578.9" y="148.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1b" text-anchor="start">270</text>
<text x="24.0" y="191.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1d1d1b" text-anchor="start">present only in the replay</text>
<rect x="250" y="176" width="39.0" height="22" rx="3" fill="#2a78d6"/>
<text x="299.0" y="192.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1b" text-anchor="start">33</text>
<text x="24.0" y="235.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1d1d1b" text-anchor="start">changed by tie ordering</text>
<rect x="250" y="220" width="10.6" height="22" rx="3" fill="#6b6b66"/>
<text x="270.6" y="236.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d1d1b" text-anchor="start">9</text>
<text x="24.0" y="282.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="start">No row present in the original run is missing from the replay. The replay adds rows and rewrites rows.</text>
</svg>
